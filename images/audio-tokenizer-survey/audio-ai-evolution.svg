<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="463" viewBox="0 0 1200 463" role="img" aria-labelledby="title desc">
  <title id="title">音频人工智能表征的四阶段演进</title>
  <desc id="desc">从波形生成、神经音频压缩、语言模型音频 token，到面向物理频带和采样率的可伸缩表征。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172331" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#667482"/>
    </marker>
  </defs>

  <rect width="1200" height="463" rx="24" fill="#f6f4ef"/>
  <text x="600" y="42" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" fill="#172331">从“还原声音”到“让声音可以被语言模型使用”</text>
  <text x="600" y="68" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5f6974">代表的是研究目标的迁移，而不是互相替代</text>

  <line x1="120" y1="292" x2="1080" y2="292" stroke="#9ba6af" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="45" y="88" width="255" height="170" rx="18" fill="#e4f3ef" stroke="#86b8aa"/>
    <rect x="325" y="88" width="255" height="170" rx="18" fill="#e8f0fa" stroke="#8ba8cc"/>
    <rect x="605" y="88" width="255" height="170" rx="18" fill="#efe9f8" stroke="#ac94cf"/>
    <rect x="885" y="88" width="270" height="170" rx="18" fill="#f8eadf" stroke="#d3a47d"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="70" y="116" font-size="13" font-weight="600" fill="#317467">2016-2020</text>
    <text x="70" y="143" font-size="20" font-weight="600" fill="#183f39">波形与层级生成</text>
    <text x="70" y="171" font-size="14" fill="#334d49">WaveNet、Jukebox</text>
    <text x="70" y="196" font-size="14" fill="#334d49">• 压缩超长波形序列</text>
    <text x="70" y="219" font-size="14" fill="#334d49">• 学习局部声学与长程结构</text>
    <text x="70" y="242" font-size="14" fill="#334d49">• 生成质量优先</text>

    <text x="350" y="116" font-size="13" font-weight="600" fill="#3d6b9f">2021-2023</text>
    <text x="350" y="143" font-size="20" font-weight="600" fill="#203f66">神经 Codec 成熟</text>
    <text x="350" y="171" font-size="14" fill="#394f68">SoundStream、EnCodec</text>
    <text x="350" y="196" font-size="14" fill="#394f68">• RVQ 与可变码率</text>
    <text x="350" y="219" font-size="14" fill="#394f68">• 对抗/频谱重建损失</text>
    <text x="350" y="242" font-size="14" fill="#394f68">• 低延迟与感知质量</text>

    <text x="630" y="116" font-size="13" font-weight="600" fill="#755aa0">2022-2025</text>
    <text x="630" y="143" font-size="20" font-weight="600" fill="#493768">Token 进入语言模型</text>
    <text x="630" y="171" font-size="14" fill="#534765">AudioLM、MusicGen、DASB</text>
    <text x="630" y="196" font-size="14" fill="#534765">• 语义/声学分层</text>
    <text x="630" y="219" font-size="14" fill="#534765">• 低帧率与可预测性</text>
    <text x="630" y="242" font-size="14" fill="#534765">• 下游任务成为评价目标</text>

    <text x="910" y="116" font-size="13" font-weight="600" fill="#9a5c2f">2024-2026</text>
    <text x="910" y="143" font-size="20" font-weight="600" fill="#6c3e21">统一表征与多轴伸缩</text>
    <text x="910" y="171" font-size="14" fill="#665044">MOSS、LLM-Codec、VCNAC</text>
    <text x="910" y="196" font-size="14" fill="#665044">• 码率、帧率、声道可伸缩</text>
    <text x="910" y="219" font-size="14" fill="#665044">• 语义与声学联合优化</text>
    <text x="910" y="242" font-size="14" fill="#665044">• 压缩目标不再充分</text>
  </g>

  <g>
    <circle cx="170" cy="292" r="10" fill="#4f9987" stroke="#fff" stroke-width="4"/>
    <circle cx="450" cy="292" r="10" fill="#5e88ba" stroke="#fff" stroke-width="4"/>
    <circle cx="730" cy="292" r="10" fill="#8668b2" stroke="#fff" stroke-width="4"/>
    <circle cx="1010" cy="292" r="10" fill="#bc7747" stroke="#fff" stroke-width="4"/>
  </g>

  <path d="M1010 306 C1010 329, 900 331, 845 348" fill="none" stroke="#bc7747" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="190" y="342" width="820" height="88" rx="18" fill="#fff" stroke="#d1b18f" stroke-width="2"/>
  <text x="600" y="371" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#6c3e21">SR-BFT 所探索的新轴</text>
  <text x="600" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#4f5963">把可伸缩表示从“发送多少 token”扩展到“按需恢复哪一段物理频带”</text>
  <text x="600" y="420" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#7a838c">同时要求同源跨采样率配对、有效带宽审计与相位/时间一致性评测</text>
</svg>
